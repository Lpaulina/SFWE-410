input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  if [application_name] == "organization-service" {
    mutate { add_tag => ["organization-service"] }
  } else if [application_name] == "licensing-service" {
    mutate { add_tag => ["license-service"] }
  } else if [application_name] == "gateway-server" {
    mutate { add_tag => ["gateway-server"] }
  }
}

output {
  elasticsearch {
    hosts => "elasticsearch:9200"
  }
}